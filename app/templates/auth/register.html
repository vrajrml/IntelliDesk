{% extends "base.html" %}

{% block title %}Create Account | IntelliDesk{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <h2 class="text-center mb-2">Create Account</h2>

                <p class="text-center text-muted mb-4">
                    Join IntelliDesk to manage your service requests.
                </p>

                <form method="POST" action="{{ url_for('auth.register') }}">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-3">
                        <label for="full_name" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="full_name"
                            name="full_name"
                            maxlength="120"
                            autocomplete="name"
                            value="{{ request.form.get('full_name', '') }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            minlength="3"
                            maxlength="80"
                            autocomplete="username"
                            value="{{ request.form.get('username', '') }}"
                            required
                        >

                        <div class="form-text">
                            Use letters, numbers, underscores, or hyphens.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            maxlength="120"
                            autocomplete="email"
                            value="{{ request.form.get('email', '') }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <div class="form-text">
                            Use at least 8 characters.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Create Account
                    </button>

                </form>

                <p class="text-center mt-4 mb-0">
                    Already registered?
                    <a href="{{ url_for('auth.login') }}">Log in</a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
